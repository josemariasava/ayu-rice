# Kitty — Ayu rice.
# Theme colors live in theme.conf (symlink to the active variant), swapped by
# ~/.config/hypr/scripts/theme-switch.sh alongside waybar/rofi/mako.
# A running kitty reloads this file on SIGUSR1 (the script sends it).

font_family             JetBrainsMono Nerd Font
bold_font               auto
italic_font             auto
bold_italic_font        auto
font_size               12.0

cursor_shape            beam
scrollback_lines        10000
enable_audio_bell       no
window_padding_width    8
confirm_os_window_close 0

# Transparency is handled by the Hyprland window rule (opacity 0.92 0.88),
# so kitty itself stays opaque to avoid double-dimming.

include theme.conf
