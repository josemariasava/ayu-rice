# hyprpaper — wallpaper daemon. Both Ayu wallpapers preloaded so the
# theme-switch script can swap instantly without reloading the daemon.
preload = ~/.config/hypr/wallpapers/ayu-mirage.png
preload = ~/.config/hypr/wallpapers/ayu-light.png

# Active wallpaper (empty monitor = all outputs). Mirage by default.
wallpaper = ,~/.config/hypr/wallpapers/ayu-mirage.png

splash = false
ipc = on
