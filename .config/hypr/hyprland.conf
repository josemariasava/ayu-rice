################################################################################
#  Hyprland config  —  Ayu rice  (Ubuntu 26.04, Intel UHD, 1920x1080)
#  Docs: https://wiki.hypr.land/Configuring/
################################################################################

# ---- Active theme colors ($accent, $background, $foreground, ...) -------------
# theme.conf is a symlink to themes/mirage.conf or themes/light.conf.
# Swap it with Super+Shift+T (see keybinds) or scripts/theme-switch.sh.
source = ~/.config/hypr/theme.conf

################################################################################
#  Monitors   —   https://wiki.hypr.land/Configuring/Monitors/
################################################################################
monitor = ,preferred,auto,1          # auto-detect; scale 1. (e.g. 1.25 for HiDPI)

################################################################################
#  Programs
################################################################################
$terminal    = kitty
$fileManager = nautilus
$menu        = rofi -show drun
$browser     = brave-browser

################################################################################
#  Autostart
################################################################################
exec-once = hyprpaper
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent
# NOTE: nm-applet / blueman-applet removed — their colored tray icons clashed with
# the theme. Network + Bluetooth now use native (monochrome) Waybar modules.
# Clipboard history (cliphist) — watch both text and images
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# Make GUI apps / portals aware of the session
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

################################################################################
#  Environment
################################################################################
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

################################################################################
#  Look & feel
################################################################################
general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = $accent $accent2 45deg
    col.inactive_border = $inactive
    resize_on_border = true           # drag window edges with the mouse to resize
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0                      # square window corners (no rounding)
    active_opacity = 1.0
    inactive_opacity = 0.96

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
    }

    shadow {
        enabled = false               # no drop shadows on windows
    }
}

animations {
    enabled = true
    bezier = ease,     0.25, 0.1, 0.25, 1.0
    bezier = overshoot, 0.05, 0.9, 0.1, 1.05
    animation = windows,     1, 5, overshoot, slide
    animation = windowsOut,  1, 5, ease, slide
    animation = border,      1, 8, ease
    animation = fade,        1, 6, ease
    animation = workspaces,  1, 5, overshoot, slide
    animation = layers,      1, 4, ease, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    focus_on_activate = true
    vfr = true                        # save power: don't render idle frames
}

################################################################################
#  Input   —   Italian keyboard
################################################################################
input {
    kb_layout = it
    follow_mouse = 1
    sensitivity = 0                   # -1.0 .. 1.0 (0 = libinput default)
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

# Gestures (reworked in Hyprland 0.51+: the old `gestures {}` block is gone).
# Syntax: gesture = fingers, direction, action [, options]
gesture = 3, horizontal, workspace   # 3-finger swipe between workspaces

################################################################################
#  Window / layer rules
################################################################################
# NOTE: Hyprland 0.53 overhauled rule syntax. New form:
#   windowrule = match:<prop> <value>, <rule> <state>
# e.g. `match:class ^(kitty)$, float on`. Old `float, class:...` no longer parses.

# Float common dialogs & utilities
windowrule = match:class ^(pavucontrol|blueman-manager|nm-connection-editor)$, float on
windowrule = match:class ^(org.gnome.Calculator|org.gnome.Settings)$, float on
windowrule = match:title ^(Open File|Save File|Choose Files)$, float on
windowrule = match:class ^(pavucontrol)$, size 60% 60%
windowrule = match:class ^(pavucontrol|blueman-manager)$, center on

# Picture-in-picture always floating and pinned
windowrule = match:title ^(Picture-in-Picture)$, float on
windowrule = match:title ^(Picture-in-Picture)$, pin on

# Slight transparency for terminal & file manager
windowrule = match:class ^(kitty)$, opacity 0.92 0.88
windowrule = match:class ^(org.gnome.Nautilus|thunar)$, opacity 0.96 0.90

# Blur the rofi/launcher & notification layers
layerrule = match:namespace ^(rofi)$, blur on
layerrule = match:namespace ^(waybar)$, blur on
layerrule = match:namespace ^(notifications)$, blur on

################################################################################
#  Keybindings   —   https://wiki.hypr.land/Configuring/Binds/
################################################################################
$mainMod = SUPER

# --- Core apps --------------------------------------------------------------
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q,      killactive,
bind = $mainMod, E,      exec, $fileManager
bind = $mainMod, D,      exec, $menu
bind = $mainMod, B,      exec, $browser
bind = $mainMod, M,      exit,                        # quit Hyprland (back to GDM)
bind = $mainMod, L,      exec, hyprlock
bind = $mainMod SHIFT, E, exec, wlogout -b 5          # power menu (5 buttons, one row)

# --- Clipboard history ------------------------------------------------------
bind = $mainMod, C, exec, cliphist list | rofi -dmenu -p "Clipboard" | cliphist decode | wl-copy

# --- Window management ------------------------------------------------------
bind = $mainMod, V,      togglefloating,              # tiled <-> floating
bind = $mainMod, F,      fullscreen,
bind = $mainMod, P,      pseudo,                       # dwindle pseudotile
bind = $mainMod, J,      togglesplit,                  # dwindle split direction

# Move focus with Super + arrows
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Move windows with Super + Shift + arrows
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# Resize active window: Super + Ctrl + arrows
binde = $mainMod CTRL, left,  resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive,  40 0
binde = $mainMod CTRL, up,    resizeactive,  0 -40
binde = $mainMod CTRL, down,  resizeactive,  0  40

# --- Mouse: float & move/resize anything ------------------------------------
# Super + Left-drag  = move window (works on tiled windows too)
# Super + Right-drag = resize window
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Workspaces -------------------------------------------------------------
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through workspaces with Super + mouse wheel
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# Special "scratchpad" workspace
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# --- Theme toggle (Ayu Mirage <-> Ayu Light) --------------------------------
bind = $mainMod SHIFT, T, exec, ~/.config/hypr/scripts/theme-switch.sh

# --- Screenshots (grim + slurp) ---------------------------------------------
bind =       , Print, exec, grim - | wl-copy                              # full screen -> clipboard
bind = $mainMod, Print, exec, grim -g "$(slurp)" - | wl-copy              # region -> clipboard
bind = SHIFT,  Print, exec, grim ~/Pictures/Screenshot-$(date +%F_%H-%M-%S).png  # full -> file

# --- Media & brightness keys ------------------------------------------------
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute   @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = , XF86AudioPlay,  exec, playerctl play-pause
bindl  = , XF86AudioNext,  exec, playerctl next
bindl  = , XF86AudioPrev,  exec, playerctl previous
