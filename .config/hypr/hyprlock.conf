# hyprlock — lock screen.  https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
# Colors follow the active rice theme: we source the same theme.conf symlink
# that hyprland.conf uses, so Super+Shift+T flips the lock screen too
# (Ayu Mirage <-> Ayu Light) with no extra steps.
source = ~/.config/hypr/theme.conf

background {
    monitor =
    path = $wallpaper          # per-theme wallpaper (set in themes/*.conf)
    blur_passes = 3
    blur_size = 7
    brightness = 0.7
}

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

# Password input field
input-field {
    monitor =
    size = 280, 54
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true
    rounding = 12
    outer_color = $accent
    inner_color = $surface
    font_color = $foreground
    fade_on_empty = false
    placeholder_text = <i>Password</i>
    check_color = $success
    fail_color = $urgent
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -40
    halign = center
    valign = center
}

# Big clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $foreground
    font_size = 110
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 220
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = $accent
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

# User greeting
label {
    monitor =
    text =    $USER
    color = $muted
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
